<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hermesaki operator</title><style>body{font:16px system-ui;background:#faf9f6;color:#222;max-width:1200px;margin:48px auto;padding:0 24px}input,button,select{font:inherit;padding:10px;border:1px solid #ddd;border-radius:6px;background:white}button{cursor:pointer}nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}table{border-collapse:collapse;width:100%;background:white}td,th{text-align:left;padding:12px;border-bottom:1px solid #eee;overflow-wrap:anywhere}main{overflow:auto}small{color:#666}.ok{color:#147338}.bad{color:#b42318}.wait{color:#9a5a00}#error{color:#b42318}</style><h1>Hermesaki</h1><p>Mail operations</p><p><a href="/ui/onboarding/live.html">Create an inbox or connect an agent →</a></p><p id="health" role="status">Checking service health…</p><label>Operator token <input id="token" type="password" autocomplete="off"></label> <button id="connect">Connect</button><p><small>Tokens stay in this tab’s memory. Message bodies are excluded from this view.</small></p><nav id="tabs"></nav><p id="error" role="alert"></p><main id="results"></main><nav><button id="prev">Previous</button><span id="page"></span><button id="next">Next</button></nav><script>fetch('/healthz').then(r=>{if(!r.ok)throw Error();return r.json()}).then(x=>{document.getElementById('health').textContent=x.status==='ok'?'Service healthy':'Health check needs attention'}).catch(()=>{document.getElementById('health').textContent='Service unavailable. Refresh to retry.'});let tab='inboxes',offset=0,more=false;const el=id=>document.getElementById(id);async function load(){el('error').textContent='';try{const r=await fetch('/v1/operator/'+tab+'?offset='+offset,{headers:{Authorization:'Bearer '+el('token').value}});const data=await r.json();if(!r.ok)throw Error(data.error);more=data.has_more;const table=document.createElement('table');if(data.items.length){let tr=table.insertRow();Object.keys(data.items[0]).forEach(k=>{let th=document.createElement('th');th.textContent=k.replaceAll('_',' ');tr.append(th)});data.items.forEach(row=>{let tr=table.insertRow();Object.entries(row).forEach(([k,v])=>{let td=tr.insertCell();td.textContent=v??'—';if(k==='state'||k==='result')td.className=['submitted','delivered','ok'].includes(v)?'ok':['failed','dead','uncertain'].includes(v)?'bad':'wait'})})}else table.textContent='Nothing here yet.';el('results').replaceChildren(table);el('page').textContent='Page '+(offset/50+1);el('prev').disabled=offset===0;el('next').disabled=!more}catch(e){el('error').textContent=e.message}}['inboxes','jobs','events','deliveries','drafts','audit','tokens'].forEach(x=>{let b=document.createElement('button');b.textContent=x;b.onclick=()=>{tab=x;offset=0;load()};el('tabs').append(b)});el('connect').onclick=load;el('prev').onclick=()=>{offset-=50;load()};el('next').onclick=()=>{offset+=50;load()};</script></html>
