server { listen 8000; client_max_body_size 5m; location / { proxy_pass http://api:8000; proxy_set_header Host $http_host; } }
server { listen 8080; client_max_body_size 5m; location / { proxy_pass http://webmail:80; proxy_set_header Host $http_host; } }
server { listen 8025; location / { proxy_pass http://capture:8025; proxy_set_header Host $http_host; } }
